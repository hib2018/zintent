name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.1
      - run: zig build test
      - run: zig build
      - run: go test ./...
        working-directory: tui
      - run: go test ./...
        working-directory: tests
